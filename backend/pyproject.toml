[project]
name = "nightshift"
version = "0.1.0"
description = "Night Shift: the on-call engineer for AI agents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "openai>=1.50",
  "neatlogs[openai]>=1.4.26",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
